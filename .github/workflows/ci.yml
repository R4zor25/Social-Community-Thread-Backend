name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and package all modules
        run: ./mvnw -B verify

  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create signing keys and .env with throwaway secrets
        run: |
          scripts/generate-keys.sh
          for name in POSTGRES AUTH_DB THREAD_DB FRIEND_DB CHAT_DB; do
            echo "${name}_PASSWORD=$(openssl rand -hex 16)" >> .env
          done
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Run the smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
