name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and package all modules
        run: ./mvnw -B verify
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage/target/site/jacoco-aggregate
          if-no-files-found: warn

  smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create signing keys and .env with throwaway secrets
        run: |
          scripts/generate-keys.sh
          for name in POSTGRES AUTH_DB THREAD_DB FRIEND_DB CHAT_DB; do
            echo "${name}_PASSWORD=$(openssl rand -hex 16)" >> .env
          done
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Run the smoke test
        run: ./scripts/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
