server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - AuthenticationFilter
      routes:
        - id: thread-service
          uri: lb://thread-service
          predicates:
            - Path=/api/thread/**

        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**

        - id: friend-service
          uri: lb://friend-service
          predicates:
            - Path=/api/friend/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**


logging:
  level:
    org:
      springframework:
        security: DEBUG