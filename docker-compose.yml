name: social-community

# Only the gateway publishes a port. Every service validates access tokens itself against auth-service's key set.

x-token-validation: &token-validation
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-service
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: social-community

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
  interval: 5s
  timeout: 3s
  retries: 40
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      THREAD_DB_PASSWORD: ${THREAD_DB_PASSWORD:?Set THREAD_DB_PASSWORD in .env}
      FRIEND_DB_PASSWORD: ${FRIEND_DB_PASSWORD:?Set FRIEND_DB_PASSWORD in .env}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Over TCP: the temporary server that runs init.sh only listens on the socket, so this waits until it is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by their owner (user-events by auth-service, compacted); a consumer that starts first
      # must not auto-create it with default settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  auth-service:
    build: { context: ., args: { MODULE: services/auth-service } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_ISSUER: http://auth-service
      AUTH_PRIVATE_KEY_PATH: /run/secrets/jwt-private
      AUTH_PUBLIC_KEY_PATH: /run/secrets/jwt-public
    secrets: [jwt-private, jwt-public]
    healthcheck: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  thread-service:
    build: { context: ., args: { MODULE: services/thread-service } }
    environment:
      <<: *token-validation
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thread
      SPRING_DATASOURCE_USERNAME: thread
      SPRING_DATASOURCE_PASSWORD: ${THREAD_DB_PASSWORD:?Set THREAD_DB_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  friend-service:
    build: { context: ., args: { MODULE: services/friend-service } }
    environment:
      <<: *token-validation
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/friend
      SPRING_DATASOURCE_USERNAME: friend
      SPRING_DATASOURCE_PASSWORD: ${FRIEND_DB_PASSWORD:?Set FRIEND_DB_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  chat-service:
    build: { context: ., args: { MODULE: services/chat-service } }
    environment:
      <<: *token-validation
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat
      SPRING_DATASOURCE_USERNAME: chat
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  # No depends_on on auth-service: the key set is fetched on the first request.
  gateway:
    build: { context: ., args: { MODULE: gateway } }
    environment:
      <<: *token-validation
      GATEWAY_SERVICES_AUTH: http://auth-service:8080
      GATEWAY_SERVICES_THREAD: http://thread-service:8080
      GATEWAY_SERVICES_FRIEND: http://friend-service:8080
      GATEWAY_SERVICES_CHAT: http://chat-service:8080
    ports:
      - "8080:8080"
    healthcheck: *healthcheck

secrets:
  jwt-private:
    file: ./secrets/jwt-private.pem
  jwt-public:
    file: ./secrets/jwt-public.pem

volumes:
  postgres-data:
